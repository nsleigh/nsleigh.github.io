<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="Claude edits files and verifies through MCP" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.ink{fill:#1f2328}.quiet{fill:#59636e}.edge{stroke:#8c959f}.bg{fill:#ffffff}
.tint{fill:#f6f8fa;stroke:#8c959f}.main{fill:#0969da;fill-opacity:.12;stroke:#0969da;stroke-width:2}
.plain{fill:none;stroke:#8c959f;stroke-width:1.25}.arrowhead{fill:#8c959f}.line{stroke:#8c959f}
@media (prefers-color-scheme: dark){
.ink{fill:#e6edf3}.quiet{fill:#9198a1}.bg{fill:none}
.tint{fill:#262a30;stroke:#6e7681}.main{fill:#4493f8;stroke:#4493f8;fill-opacity:.18}
.plain{stroke:#6e7681}.arrowhead{fill:#6e7681}.line{stroke:#6e7681}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
<rect width="760" height="344" class="bg"/>
<text x="24" y="28" font-size="15" font-weight="600" class="ink">Claude edits files and verifies through MCP</text>
<rect x="24" y="52" width="520" height="268" rx="8" class="tint"/>
<text x="40" y="76" font-weight="600" class="ink">Home Assistant OS (VM on Proxmox)</text>
<g fill="none" class="line" stroke-width="1.25">
<path d="M250 128H318" marker-end="url(#a)"/><path d="M423 168V232" marker-end="url(#a)"/><path d="M145 184V232" marker-end="url(#a)"/>
<path d="M250 260H318" marker-end="url(#a)"/><path d="M528 260H568" marker-end="url(#a)"/><path d="M200 96V86H652V96" marker-end="url(#a)"/>
</g>
<rect x="40" y="96" width="210" height="88" rx="8" class="main"/>
<text x="56" y="120" font-weight="600" class="ink">Claude Terminal Pro</text>
<text x="56" y="136" font-size="11.5" class="ink">app running Claude Code</text>
<text x="56" y="152" font-size="11.5" class="ink">git, gh and ha CLI</text>
<text x="56" y="168" font-size="11.5" class="ink">CLAUDE.md, memory, skills</text>
<rect x="318" y="96" width="210" height="72" rx="8" class="plain"/>
<text x="334" y="120" font-weight="600" class="ink">ha-mcp app</text>
<text x="334" y="136" font-size="11.5" class="quiet">80+ tools: states, logs,</text>
<text x="334" y="152" font-size="11.5" class="quiet">traces, config, services</text>
<rect x="40" y="232" width="210" height="72" rx="8" class="plain"/>
<text x="56" y="256" font-weight="600" class="ink">/config git repo</text>
<text x="56" y="272" font-size="11.5" class="quiet">YAML packages, automations</text>
<text x="56" y="288" font-size="11.5" class="quiet">secrets, .storage ignored</text>
<rect x="318" y="232" width="210" height="56" rx="8" class="plain"/>
<text x="334" y="256" font-weight="600" class="ink">Home Assistant Core</text>
<text x="334" y="272" font-size="11.5" class="quiet">automations, integrations</text>
<rect x="568" y="96" width="168" height="72" rx="8" class="plain"/>
<text x="584" y="120" font-weight="600" class="ink">UniFi controller</text>
<text x="584" y="136" font-size="11.5" class="quiet">via unifi-network-mcp</text>
<text x="584" y="152" font-size="11.5" class="quiet">read-only account</text>
<rect x="568" y="232" width="168" height="72" rx="8" class="plain"/>
<text x="584" y="256" font-weight="600" class="ink">GitHub (private)</text>
<text x="584" y="272" font-size="11.5" class="quiet">nightly push at 01:00</text>
<text x="584" y="288" font-size="11.5" class="quiet">via shell_command</text>
<text x="284" y="120" text-anchor="middle" font-size="11.5" class="quiet">MCP</text>
<text x="600" y="80" text-anchor="middle" font-size="11.5" class="quiet">MCP over stdio</text>
<text x="431" y="204" font-size="11.5" class="quiet">HA API</text>
<text x="153" y="212" font-size="11.5" class="quiet">edits YAML, commits</text>
